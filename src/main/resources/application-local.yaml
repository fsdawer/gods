spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/joat
    username: joat
    password: joat
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50  # saveAll() 호출 시 INSERT를 최대 50개 단위로 묶어 배치 실행
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5
    locations: classpath:db/migration,classpath:db/seed
  data:
    redis:
      port: 6380
  kafka:
    enabled: true

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256

# FCM 푸시 알림
# firebase.enabled=true로 바꾸고 service-account-key 경로를 설정하면 실제 FCM 발송 활성화
# Firebase Console > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성 후 경로 입력
firebase:
  enabled: false
  service-account-key: /path/to/firebase-service-account.json

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging.simp: DEBUG
